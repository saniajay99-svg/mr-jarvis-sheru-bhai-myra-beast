name: Build Android Debug APK & Play Console AAB

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish APK & AAB as GitHub Release'
        required: false
        type: boolean
        default: true
      release_tag:
        description: 'Custom Release Tag (e.g. v1.0.1, leave empty for automated tag)'
        required: false
        type: string
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-android-packages:
    name: Build Android APK & Play Console AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Dependencies & Capacitor Android Bridge
        run: |
          npm ci || npm install
          npm install --no-save @capacitor/core@^8.0.0 @capacitor/android@^8.0.0 @capacitor/cli@^8.0.0

      - name: Build Web Application
        run: npm run build

      - name: Sync Web Bundle into Android Assets
        run: |
          rm -rf android/app/src/main/assets/public
          mkdir -p android/app/src/main/assets/public
          cp -R dist/* android/app/src/main/assets/public/
          npx cap sync android || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Decode Optional Release Keystore (for Play Console AAB signing)
        id: keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "${{ runner.temp }}/release-keystore.jks"
          echo "keystore_path=${{ runner.temp }}/release-keystore.jks" >> $GITHUB_OUTPUT

      - name: Assemble Android Debug APK (for Mobile Testing)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Build Android App Bundle (.aab for Google Play Console)
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.keystore_path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew bundleRelease --stacktrace

      - name: Prepare APK & AAB Outputs
        id: prepare_outputs
        run: |
          mkdir -p build-artifacts src/releases
          SOURCE_APK="android/app/build/outputs/apk/debug/app-debug.apk"
          SOURCE_AAB="android/app/build/outputs/bundle/release/app-release.aab"

          if [ ! -f "$SOURCE_APK" ]; then
            echo "::error::Source APK not found at $SOURCE_APK"
            exit 1
          fi
          if [ ! -f "$SOURCE_AAB" ]; then
            echo "::error::Source AAB not found at $SOURCE_AAB"
            exit 1
          fi

          TARGET_APK="build-artifacts/MrJarvisBeast-v1.0-debug.apk"
          TARGET_AAB="build-artifacts/MrJarvisBeast-v1.0-release.aab"
          cp "$SOURCE_APK" "$TARGET_APK"
          cp "$SOURCE_AAB" "$TARGET_AAB"
          cp "$SOURCE_APK" "src/releases/mr-jarvis-beast-debug.apk"
          cp "$SOURCE_AAB" "src/releases/mr-jarvis-beast-release.aab"

          APK_SIZE=$(ls -lh "$TARGET_APK" | awk '{print $5}')
          AAB_SIZE=$(ls -lh "$TARGET_AAB" | awk '{print $5}')
          APK_SHA=$(sha256sum "$TARGET_APK" | awk '{print $1}')
          AAB_SHA=$(sha256sum "$TARGET_AAB" | awk '{print $1}')

          echo "apk_path=$TARGET_APK" >> $GITHUB_OUTPUT
          echo "aab_path=$TARGET_AAB" >> $GITHUB_OUTPUT
          echo "apk_name=MrJarvisBeast-v1.0-debug.apk" >> $GITHUB_OUTPUT
          echo "aab_name=MrJarvisBeast-v1.0-release.aab" >> $GITHUB_OUTPUT
          echo "apk_size=$APK_SIZE" >> $GITHUB_OUTPUT
          echo "aab_size=$AAB_SIZE" >> $GITHUB_OUTPUT
          echo "apk_sha=$APK_SHA" >> $GITHUB_OUTPUT
          echo "aab_sha=$AAB_SHA" >> $GITHUB_OUTPUT

          ls -lh "$TARGET_APK" "$TARGET_AAB"

      - name: Upload APK & AAB to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mr-jarvis-beast-apk-and-aab
          path: |
            ${{ steps.prepare_outputs.outputs.apk_path }}
            ${{ steps.prepare_outputs.outputs.aab_path }}
          retention-days: 30

      - name: Determine Release Details
        id: release_info
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true) || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            IS_PRERELEASE="false"
            RELEASE_TITLE="Mr Jarvis Beast Release $TAG_NAME (APK + AAB)"
          elif [ -n "${{ inputs.release_tag }}" ]; then
            TAG_NAME="${{ inputs.release_tag }}"
            IS_PRERELEASE="false"
            RELEASE_TITLE="Mr Jarvis Beast Release $TAG_NAME (APK + AAB)"
          else
            TAG_NAME="v1.0.0-build-${{ github.run_number }}"
            IS_PRERELEASE="true"
            RELEASE_TITLE="Mr Jarvis Beast Android Build #${{ github.run_number }} (APK + AAB)"
          fi
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT
          echo "release_title=$RELEASE_TITLE" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        if: steps.release_info.outputs.tag_name != ''
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: ${{ steps.release_info.outputs.release_title }}
          draft: false
          prerelease: ${{ steps.release_info.outputs.is_prerelease == 'true' }}
          files: |
            ${{ steps.prepare_outputs.outputs.apk_path }}
            ${{ steps.prepare_outputs.outputs.aab_path }}
          generate_release_notes: true
          body: |
            ### 👑 Mr Jarvis Beast — Android APK (Testing) & Play Console AAB
            **Dedicated Exclusively for Master Ajay Boss**

            - **Package ID**: `com.aijayboss.mrjarvisbeast`
            - **APK (Direct Phone Testing)**: `${{ steps.prepare_outputs.outputs.apk_name }}` (`${{ steps.prepare_outputs.outputs.apk_size }}`)
            - **AAB (Google Play Console Mandatory Bundle)**: `${{ steps.prepare_outputs.outputs.aab_name }}` (`${{ steps.prepare_outputs.outputs.aab_size }}`)
            - **Target SDK**: `36` (Android 16) | **Min SDK**: `24` (Android 7.0)

            #### 📲 Install APK on Android Phone:
            1. Download `${{ steps.prepare_outputs.outputs.apk_name }}` under **Assets**.
            2. Open the file and tap **Install** (allow *Install unknown apps* when prompted).

            #### 🚀 Google Play Console Upload (.aab):
            1. Download `${{ steps.prepare_outputs.outputs.aab_name }}` under **Assets**.
            2. Note: Ensure `ANDROID_KEYSTORE_BASE64`, `ANDROID_KEYSTORE_PASSWORD`, `ANDROID_KEY_ALIAS`, and `ANDROID_KEY_PASSWORD` secrets are configured (or sign the `.aab` with `jarsigner`) before uploading to Google Play Console.

      - name: Generate Job Summary
        run: |
          echo "## 👑 Mr Jarvis Beast Android APK & Play Console AAB Built!" >> $GITHUB_STEP_SUMMARY
          echo "- **Package ID:** \`com.aijayboss.mrjarvisbeast\`" >> $GITHUB_STEP_SUMMARY
          echo "- **APK:** \`${{ steps.prepare_outputs.outputs.apk_name }}\` (\`${{ steps.prepare_outputs.outputs.apk_size }}\`)" >> $GITHUB_STEP_SUMMARY
          echo "- **AAB:** \`${{ steps.prepare_outputs.outputs.aab_name }}\` (\`${{ steps.prepare_outputs.outputs.aab_size }}\`)" >> $GITHUB_STEP_SUMMARY
